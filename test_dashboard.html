
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AeroSense — Camera Monitoring</title>

<style>
:root {
  --bg: #0e1621;
  --panel: #16202c;
  --line: #243242;
  --text: #e6edf3;
  --muted: #8b9bb0;
  --teal: #1c7293;
  --green: #2ea043;
  --red: #e5484d;
  --orange: #d29922;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 18px;
}

h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 18px;
}

.bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

input {
  background: #0b1118;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px;
  border-radius: 6px;
  width: 280px;
}

button {
  border: none;
  color: white;
  padding: 10px 17px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#startBtn { background: var(--teal); }
#stopBtn { background: var(--red); }
#resumeBtn { background: var(--green); }

.meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 10px;
}

#status {
  font-weight: 600;
}

#alertBanner {
  display: none;
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 50;
  background: var(--red);
  color: white;
  font-weight: 700;
  font-size: 14px;
  padding: 12px 16px;
  border-radius: 8px;
  box-shadow: 0 4px 14px #e5484d55;
}

#alertBanner.show {
  display: block;
}

#pauseBadge {
  display: none;
  background: var(--orange);
  color: #111;
  padding: 5px 9px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 700;
}

#pauseBadge.show {
  display: inline-block;
}

.layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}

@media (max-width: 800px) {
  .layout {
    grid-template-columns: 1fr;
  }

  input {
    width: 100%;
  }
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  min-width: 0;
}

.label {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--teal);
  font-weight: 700;
  margin-bottom: 12px;
}

#videoWrap {
    min-height: 0;
    height: clamp(260px, 55vh, 530px);
    background: #000;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#frame {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#placeholder {
  color: var(--muted);
  font-size: 14px;
  padding: 40px;
  text-align: center;
}

#box {
  position: absolute;
  border: 3px solid var(--red);
  display: none;
  box-shadow: 0 0 10px #e5484d99;
  pointer-events: none;
}

#boxLabel {
  position: absolute;
  top: -23px;
  left: -3px;
  background: var(--red);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 6px;
}

.sensor {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0b1118;
  border: 2px solid var(--green);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
}

.sensor.alert {
  border-color: var(--red);
  background: #2a1416;
  animation: flash 0.6s infinite;
}

.sensor .name {
  font-weight: 600;
}

.sensor .state {
  font-size: 12px;
  color: var(--green);
  font-weight: 700;
}

.sensor.alert .state {
  color: var(--red);
}

.sensor.off {
  border-color: var(--line);
  opacity: 0.5;
}

.sensor.off .state {
  color: var(--muted);
}

@keyframes flash {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}

#log {
  background: #0b1118;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  height: 260px;
  overflow-y: auto;
  font-size: 12px;
  font-family: Consolas, monospace;
  overflow-wrap: anywhere;
}

.log-drone {
  color: #ff8b8b;
  margin-bottom: 6px;
}

.log-clear {
  color: var(--muted);
  margin-bottom: 6px;
}
</style>
</head>

<body>
<h1>AeroSense — Camera Monitoring</h1>
<div class="sub">
  Sensor-based drone detection dashboard
</div>

<div id="alertBanner"></div>

<div class="bar">
  <input
    id="serverUrl"
    value="ws://127.0.0.1:8000/ws"
    aria-label="WebSocket server address"
  />

  <button id="startBtn" onclick="start()">▶ Start</button>
  <button id="stopBtn" onclick="pause()" disabled>⏸ Stop</button>
  <button id="resumeBtn" onclick="resume()" disabled>▶ Resume</button>

  <span id="status">Not connected</span>
  <span id="pauseBadge">PAUSED</span>
</div>

<div class="layout">
  <div class="card">
    <div class="label">LIVE CAMERA FEED</div>

    <div id="videoWrap">
      <div id="placeholder">Press Start to begin the feed.</div>
      <img id="frame" alt="Current camera frame" />
      <div id="box">
        <div id="boxLabel">DRONE</div>
      </div>
    </div>

    <div class="meta" id="frameInfo">No frame displayed</div>
  </div>

  <div class="card">
    <div class="label">SENSOR STATUS</div>

    <div class="sensor" id="cam">
      <span class="name">📷 Camera</span>
      <span class="state" id="camState">MONITORING</span>
    </div>

    <div class="sensor off">
      <span class="name">🎤 Audio</span>
      <span class="state">NOT CONNECTED</span>
    </div>

    <div class="sensor off">
      <span class="name">📡 Radar</span>
      <span class="state">NOT CONNECTED</span>
    </div>

    <div class="sensor off">
      <span class="name">🟢 LiDAR</span>
      <span class="state">NOT CONNECTED</span>
    </div>

    <div class="label" style="margin-top: 18px;">EVENT LOG</div>
    <div id="log"></div>
  </div>
</div>

<script>
let ws = null;
let audioCtx = null;
let droneWasShowing = false;
let isPaused = false;
let isRunning = false;
let lastFrame = null;

const $ = id => document.getElementById(id);

function setStatus(message) {
  $("status").textContent = message;
}

function updateButtons() {
  $("startBtn").disabled = isRunning;
  $("stopBtn").disabled = !isRunning || isPaused;
  $("resumeBtn").disabled = !isRunning || !isPaused;
  $("pauseBadge").classList.toggle("show", isPaused);
}

async function activateAudio() {
  try {
    if (!audioCtx) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        throw new Error("Web Audio API is not supported.");
      }

      audioCtx = new AudioContextClass();
    }

    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }

    return audioCtx.state === "running";
  } catch (error) {
    console.error("Audio activation failed:", error);
    return false;
  }
}

function beep() {
  if (!audioCtx || audioCtx.state !== "running") {
    console.warn("Beep skipped: audio is not running.");
    return;
  }

  try {
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(880, now);

    gain.gain.setValueAtTime(0.15, now);
    gain.gain.setValueAtTime(0.15, now + 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.18);
  } catch (error) {
    console.error("Beep playback failed:", error);
  }
}

function addLog(message, isDrone) {
  const line = document.createElement("div");
  line.className = isDrone ? "log-drone" : "log-clear";
  line.textContent = message;

  $("log").appendChild(line);
  $("log").scrollTop = $("log").scrollHeight;
}


function drawBox(box, img) {
  const boxEl = $("box");

  if (!box || !img.naturalWidth || !img.naturalHeight) {
    boxEl.style.display = "none";
    return;
  }

  const wrap = $("videoWrap");
  const [x, y, width, height] = box;

  // Calculate the image size when object-fit: contain is used.
  const scale = Math.min(
    img.clientWidth / img.naturalWidth,
    img.clientHeight / img.naturalHeight
  );

  const displayedWidth = img.naturalWidth * scale;
  const displayedHeight = img.naturalHeight * scale;

  // Account for empty space around the displayed image.
  const offsetX = img.offsetLeft +
    (img.clientWidth - displayedWidth) / 2;

  const offsetY = img.offsetTop +
    (img.clientHeight - displayedHeight) / 2;

  boxEl.style.left = (offsetX + x * scale) + "px";
  boxEl.style.top = (offsetY + y * scale) + "px";
  boxEl.style.width = (width * scale) + "px";
  boxEl.style.height = (height * scale) + "px";
  boxEl.style.display = "block";
}

function displayFrame(msg) {
  lastFrame = msg;

  const img = $("frame");
  const boxEl = $("box");
  const isDrone = msg.drone === true;

  img.onload = () => {
    if (lastFrame === msg && isDrone && msg.box) {
      drawBox(msg.box, img);
    } else if (lastFrame === msg) {
      boxEl.style.display = "none";
    }
  };

  img.src = msg.image;
  img.style.display = "block";
  $("placeholder").style.display = "none";

  $("frameInfo").textContent =
    `Frame ${msg.index + 1} / ${msg.total} · ${msg.frame_name}`;

  const cam = $("cam");
  const camState = $("camState");
  const banner = $("alertBanner");

  if (isDrone) {
    cam.classList.add("alert");
    camState.textContent = "⚠ DRONE DETECTED";

    banner.textContent =
      `⚠ Drone detected — ${Math.round((msg.confidence || 0) * 100)}%`;
    banner.classList.add("show");

    // Beep on each drone-positive frame.
    beep();
    droneWasShowing = true;

    addLog(
      `Frame ${msg.index + 1} ⚠ DRONE ${Math.round(
        (msg.confidence || 0) * 100
      )}%`,
      true
    );
  } else {
    cam.classList.remove("alert");
    camState.textContent = "MONITORING";
    banner.classList.remove("show");
    boxEl.style.display = "none";
    droneWasShowing = false;

    addLog(`Frame ${msg.index + 1} · Clear`, false);
  }
}

function sendControl(action) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action }));
  }
}

async function start() {
  if (isRunning) return;

  // Audio must be activated by a user gesture.
  await activateAudio();

  const url = $("serverUrl").value.trim();

  if (!url.startsWith("ws://") && !url.startsWith("wss://")) {
    setStatus("Enter a valid WebSocket URL.");
    return;
  }

  if (ws) {
    ws.close();
  }

  isPaused = false;
  isRunning = true;
  droneWasShowing = false;
  lastFrame = null;

  $("log").replaceChildren();
  $("alertBanner").classList.remove("show");
  $("cam").classList.remove("alert");
  $("camState").textContent = "MONITORING";

  setStatus("Connecting...");
  updateButtons();

  try {
    ws = new WebSocket(url);
  } catch (error) {
    isRunning = false;
    updateButtons();
    setStatus("Could not create WebSocket.");
    console.error(error);
    return;
  }

  const connection = ws;

  connection.onopen = () => {
    if (ws !== connection) return;
    setStatus("Connected ✓");
  };

  connection.onmessage = event => {
    if (ws !== connection) return;

    let msg;

    try {
      msg = JSON.parse(event.data);
    } catch (error) {
      console.error("Invalid server message:", error);
      return;
    }

    if (msg.type === "error") {
      setStatus("Server: " + msg.message);
      return;
    }

    if (msg.type === "paused") {
      return;
    }

    if (msg.type === "end") {
      isRunning = false;
      isPaused = false;
      droneWasShowing = false;
      updateButtons();
      setStatus("Replay finished ✓");
      return;
    }

    if (msg.type !== "frame") return;

    // The server waits when paused, so frames are not lost.
    if (!isPaused) {
      displayFrame(msg);
    }
  };

  connection.onerror = error => {
    console.error("WebSocket error:", error);
    setStatus("Connection error — check server and URL.");
  };

  connection.onclose = () => {
    if (ws !== connection) return;

    isRunning = false;
    isPaused = false;
    droneWasShowing = false;
    updateButtons();

    if ($("status").textContent === "Connected ✓") {
      setStatus("Disconnected");
    }
  };
}

function pause() {
  if (!isRunning || isPaused) return;

  isPaused = true;
  sendControl("pause");

  setStatus("Paused at current frame");
  updateButtons();
}

async function resume() {
  if (!isRunning || !isPaused) return;

  await activateAudio();

  isPaused = false;
  sendControl("resume");

  setStatus("Resuming playback...");
  updateButtons();
}

// Keep the detection box aligned if the window is resized.
window.addEventListener("resize", () => {
  if (lastFrame && lastFrame.drone && lastFrame.box) {
    drawBox(lastFrame.box, $("frame"));
  }
});
</script>
</body>
</html>

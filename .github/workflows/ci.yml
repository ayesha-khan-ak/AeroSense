name: AeroSense CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python checks and automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (without LFS videos/weights)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test tools (httpx for FastAPI TestClient, pymavlink for protocol cross-check)
        run: python -m pip install pytest httpx pymavlink

      - name: Check Python syntax
        run: python -m compileall -q server.py make_detections.py make_test_frames.py geo.py geofence.py mavlink_lite.py qgc_plan.py sim_drone.py sensor_adapters.py tools

      - name: Run automated tests
        run: python -m pytest -v
